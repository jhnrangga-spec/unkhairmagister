{% extends "base.html" %}
{% block title %}Pendaftaran Mahasiswa Baru S2{% endblock %}
{% block content %}
<h3 class="mb-3">Formulir Pendaftaran Mahasiswa Baru S2</h3>
<form method="post" enctype="multipart/form-data" class="card"><div class="card-body">

  <h5>Data Pribadi</h5>
  <div class="row g-3">
    <div class="col-md-8"><label class="form-label">Nama Lengkap *</label>
      <input name="nama_lengkap" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">NIK *</label>
      <input name="nik" class="form-control" required></div>
    <div class="col-md-4"><label class="form-label">Tempat Lahir</label>
      <input name="tempat_lahir" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">Tanggal Lahir</label>
      <input name="tanggal_lahir" type="date" class="form-control"></div>
    <div class="col-md-3"><label class="form-label">Jenis Kelamin</label>
      <select name="jenis_kelamin" class="form-select">
        <option value="">- pilih -</option>
        <option>Laki-laki</option><option>Perempuan</option>
      </select></div>
    <div class="col-md-2"><label class="form-label">No. HP</label>
      <input name="no_hp" class="form-control"></div>
    <div class="col-12"><label class="form-label">Alamat</label>
      <textarea name="alamat" class="form-control" rows="2"></textarea></div>
  </div>

  <hr class="my-4">
  <h5>Pendidikan S1</h5>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Asal Universitas S1</label>
      <input name="asal_universitas_s1" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Program Studi S1</label>
      <input name="program_studi_s1" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">Tahun Lulus</label>
      <input name="tahun_lulus_s1" type="number" min="1980" max="2030" class="form-control"></div>
    <div class="col-md-2"><label class="form-label">IPK S1</label>
      <input name="ipk_s1" type="number" step="0.01" min="0" max="4" class="form-control"></div>
  </div>

  <hr class="my-4">
  <h5>Pilihan Program S2</h5>
  <div class="row g-3">
    <div class="col-md-8"><label class="form-label">Program Studi Tujuan *</label>
      <select name="program_studi_tujuan" class="form-select" required>
        <option value="">- pilih -</option>
        <option>Magister Manajemen</option>
        <option>Magister Ilmu Komputer</option>
        <option>Magister Pendidikan</option>
        <option>Magister Hukum</option>
        <option>Magister Teknik</option>
        <option>Magister Ilmu Lingkungan</option>
      </select></div>
    <div class="col-md-4"><label class="form-label">Gelombang</label>
      <select name="gelombang" class="form-select">
        <option value="">- pilih -</option>
        <option>Gelombang 1</option>
        <option>Gelombang 2</option>
      </select></div>
  </div>

  <hr class="my-4">
  <h5>Dokumen (PDF/JPG/PNG, maks 5 MB)</h5>
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label">Ijazah S1</label>
      <input name="file_ijazah" type="file" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">Transkrip S1</label>
      <input name="file_transkrip" type="file" class="form-control"></div>
    <div class="col-md-4"><label class="form-label">KTP</label>
      <input name="file_ktp" type="file" class="form-control"></div>
  </div>

  <div class="mt-4">
    <button class="btn btn-primary">Kirim Pendaftaran</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-light">Batal</a>
  </div>
</div></form>
{% endblock %}
